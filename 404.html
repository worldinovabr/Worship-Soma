    <script id="worship-ios-scroll-fix-v3">
      (function () {
        try {
          var navegador = window.navigator;

          var userAgent =
            navegador.userAgent || '';

          var ehIOS =
            /iPhone|iPad|iPod/i.test(userAgent);

          var ehIPadComoMac =
            navegador.platform === 'MacIntel' &&
            navegador.maxTouchPoints > 1;

          /*
           * Android e computador continuam exatamente
           * com o comportamento original.
           */
          if (!ehIOS && !ehIPadComoMac) {
            return;
          }

          document.documentElement.classList.add(
            'worship-ios-scroll-fix'
          );

          var atualizacaoAgendada = false;

          function configurarElementosComRolagem() {
            atualizacaoAgendada = false;

            var raiz =
              document.getElementById('root');

            if (!raiz) {
              return;
            }

            var elementos =
              raiz.querySelectorAll('*');

            for (
              var indice = 0;
              indice < elementos.length;
              indice += 1
            ) {
              var elemento =
                elementos[indice];

              var estilo =
                window.getComputedStyle(
                  elemento
                );

              var possuiRolagemVertical =
                estilo.overflowY === 'auto' ||
                estilo.overflowY === 'scroll';

              if (!possuiRolagemVertical) {
                continue;
              }

              /*
               * Mantém a rolagem fluida no Safari
               * e em aplicativos instalados como PWA.
               */
              if (
                elemento.style.webkitOverflowScrolling !==
                'touch'
              ) {
                elemento.style.webkitOverflowScrolling =
                  'touch';
              }

              /*
               * Evita que o gesto de rolagem seja
               * transferido para a página inteira.
               */
              if (
                elemento.style.overscrollBehaviorY !==
                'contain'
              ) {
                elemento.style.overscrollBehaviorY =
                  'contain';
              }
            }
          }

          function agendarAtualizacao() {
            if (atualizacaoAgendada) {
              return;
            }

            atualizacaoAgendada = true;

            if (
              typeof window.requestAnimationFrame ===
              'function'
            ) {
              window.requestAnimationFrame(
                configurarElementosComRolagem
              );

              return;
            }

            window.setTimeout(
              configurarElementosComRolagem,
              16
            );
          }

          function iniciarCorrecaoIOS() {
            var raiz =
              document.getElementById('root');

            if (!raiz) {
              window.setTimeout(
                iniciarCorrecaoIOS,
                120
              );

              return;
            }

            configurarElementosComRolagem();

            /*
             * Aplica o ajuste quando o React cria uma nova
             * tela, ScrollView ou FlatList.
             */
            if ('MutationObserver' in window) {
              var observador =
                new MutationObserver(
                  agendarAtualizacao
                );

              observador.observe(
                raiz,
                {
                  childList: true,
                  subtree: true,
                }
              );
            }

            window.addEventListener(
              'orientationchange',
              agendarAtualizacao,
              {
                passive: true,
              }
            );

            window.addEventListener(
              'pageshow',
              agendarAtualizacao,
              {
                passive: true,
              }
            );
          }

          if (
            document.readyState === 'loading'
          ) {
            document.addEventListener(
              'DOMContentLoaded',
              iniciarCorrecaoIOS,
              {
                once: true,
              }
            );
          } else {
            iniciarCorrecaoIOS();
          }
        } catch (error) {
          console.log(
            'Não foi possível configurar a rolagem no iOS:',
            error
          );
        }
      })();
    </script>
