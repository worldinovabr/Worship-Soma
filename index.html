<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a">
    <base href="/Worship-Soma/">
    <link rel="manifest" href="/Worship-Soma/manifest.json">
    <link rel="icon" href="/Worship-Soma/icon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/Worship-Soma/icon-512.png" />
    <meta name="msapplication-TileImage" content="/Worship-Soma/icon-512.png">
    <title>WorshipApp</title>
    <link rel="stylesheet" href="/Worship-Soma/style.css">
    <style>
      #root,body,html{width:100%;-webkit-overflow-scrolling:touch;margin:0;padding:0;min-height:100%}
      #root{flex-shrink:0;flex-basis:auto;flex-grow:1;display:flex;flex:1}
      html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;height:calc(100% + env(safe-area-inset-top))}
      body{display:flex;overflow-y:auto;overscroll-behavior-y:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-ms-overflow-style:scrollbar}
    </style>
    <script defer src="/Worship-Soma/static/js/33.7d6f18b5.js"></script>
    <script defer src="/Worship-Soma/static/js/main.0f803eee.js"></script>
  </head>
  <body>
    <noscript>
      <form action="" style="background-color:#fff;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999">
        <div style="font-size:18px;font-family:Helvetica,sans-serif;line-height:24px;margin:10%;width:80%">
          <p>Oh no! It looks like JavaScript is not enabled in your browser.</p>
          <p style="margin:20px 0"><button type="submit" style="background-color:#4630eb;border-radius:100px;border:none;box-shadow:none;color:#fff;cursor:pointer;font-weight:700;line-height:20px;padding:6px 16px">Reload</button></p>
        </div>
      </form>
    </noscript>

    <!-- App root -->
    <div id="root"></div>

    <!-- Optional: small install banner for PWA -->
    <style>
      #pwa-install-banner{position:fixed;right:16px;bottom:16px;z-index:10000;background:#0b84ff;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;font-family:Arial,Helvetica,sans-serif}
      #pwa-install-banner button{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 10px;border-radius:8px;font-weight:600;cursor:pointer}
      #pwa-install-banner img{width:36px;height:36px;border-radius:8px;object-fit:cover}
    </style>

    <script>
      (function(){
        let deferredPrompt = null;
        let banner = null;

        window.addEventListener('beforeinstallprompt', function(e){
          e.preventDefault();
          deferredPrompt = e;
          showBanner();
        });

        function tryPromptOnFirstClick(){
          function onClickOnce(){
            if (deferredPrompt){
              deferredPrompt.prompt();
              deferredPrompt.userChoice.then(()=>{ deferredPrompt = null; removeBanner(); });
            }
            document.removeEventListener('click', onClickOnce);
          }
          document.addEventListener('click', onClickOnce);
        }

        function showBanner(){
          if (banner) return;
          banner = document.createElement('div');
          banner.id = 'pwa-install-banner';
          banner.innerHTML = '<img src="/Worship-Soma/icon-512.png" alt="app"/><div style="display:flex;flex-direction:column"><div style="font-size:14px;font-weight:700">Instalar WorshipApp</div><div style="font-size:12px;opacity:.9">Adicione o app à sua tela inicial</div></div><button id="pwa-install-btn">Instalar</button>';
          document.body.appendChild(banner);
          document.getElementById('pwa-install-btn').addEventListener('click', async function(){
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            deferredPrompt = null;
            removeBanner();
          });
          tryPromptOnFirstClick();
        }

        function removeBanner(){ if (banner){ banner.remove(); banner = null; } }
        window.addEventListener('appinstalled', function(){ deferredPrompt = null; removeBanner(); });
      })();
    </script>
  </body>
</html>
