    <script id="worship-ios-scroll-fix-v2">
      (function () {

          var navegador = window.navigator;
          var userAgent = navegador.userAgent || '';

          var ehIPadComoMac =
            navegador.platform === 'MacIntel' &&
            navegador.maxTouchPoints > 1;

          if (!ehIOS && !ehIPadComoMac) {
            return;
          }

          document.documentElement.classList.add(
            'worship-ios-scroll-fix'
          );

          var atualizacaoAgendada = false;
          var observador = null;

          function configurarElementosComRolagem() {
            atualizacaoAgendada = false;

            var raiz = document.getElementById('root');

            if (!raiz) {
              return;
            }

            var elementos =
              raiz.querySelectorAll('*');

            for (
              var indice = 0;
              indice < elementos.length;
              indice += 1
            ) {
              var elemento = elementos[indice];

              var estilo =
                window.getComputedStyle(elemento);

              var possuiRolagemVertical =
                estilo.overflowY === 'auto' ||
                estilo.overflowY === 'scroll';

              if (!possuiRolagemVertical) {
                continue;
              }

               * Mantém a rolagem fluida no Safari.

                elemento.style.webkitOverflowScrolling !==
                'touch'

                  'touch';
              }

               * Evita transferir o movimento para o body,
               * o que pode fazer a tela voltar para o topo.

                elemento.style.overscrollBehaviorY !==
                'contain'

                  'contain';
              }

               * Preserva a rolagem vertical dos conteúdos.

              if (
                elemento.style.touchAction !==
                'pan-y'
              ) {
                elemento.style.touchAction =
                  'pan-y';
              }

              /*
               * Necessário para elementos flex internos
               * poderem calcular a altura corretamente.
               */
              if (
                elemento.style.minHeight !==
                '0px'
              ) {
                elemento.style.minHeight =
                  '0px';
              }
            }
          }

          function agendarAtualizacao() {
            if (atualizacaoAgendada) {
              return;
            }

            if (
              typeof window.requestAnimationFrame ===
              'function'

                configurarElementosComRolagem

            }

            window.setTimeout(
              configurarElementosComRolagem,
              16
            );
          }

          function iniciarCorrecaoIOS() {

            if (!raiz) {
              window.setTimeout(
                iniciarCorrecaoIOS,
                120
              );

              return;
            }

            configurarElementosComRolagem();

            /*

                raiz,

                }
              );
            }

              'orientationchange',
              agendarAtualizacao,
              {
                passive: true,
              }
            );

              'pageshow',
              agendarAtualizacao,
              {
                passive: true,
              }
            );

                'resize',

              iniciarCorrecaoIOS,
